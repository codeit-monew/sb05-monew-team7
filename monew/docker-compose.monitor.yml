services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monew-net      # ✅ App 네트워크 추가
      - monitor-net    # Grafana와 통신용

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monew-net      # ✅ 동일하게 App 네트워크 추가
      - monitor-net

volumes:
  grafana_data:

networks:
  monitor-net:
    name: monitor-net
  monew-net:
    external: true
