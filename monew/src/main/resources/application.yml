spring:
  application:
    name: monew
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/monew?sessionTimezone=UTC
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # 'none' for initial creation, 'validate' afterwards
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: false
  sql:
    init:
      mode: never # 'always' for initial creation, 'never' afterwards

  data:
    mongodb:
      uri: mongodb://localhost:27017/monew
    redis:
      host: localhost
      port: 6379
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.batch: INFO
    com.spring.monew: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aws:
  s3:
    bucket: your-bucket-name
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY_ID:dummy-access}
    secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-secret}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:dummy-naver-id}
    client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-secret}

batch:
  trigger:
    enabled: ${BATCH_TRIGGER_ENABLED:true}
