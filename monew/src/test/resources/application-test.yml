spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # Hibernate가 직접 테이블 생성
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never             # schema.sql 실행하지 않음 ❗

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

logging:
  level:
    org.hibernate.SQL: debug
